# =============================================================================
# FIMS — Fair Competition Commission Integrated Management System
# =============================================================================
#
# ALL traffic goes through the NGINX API Gateway on port 8080.
# NGINX handles:
#   - All /api/v1/* routes → backend services (IAM, Documents, WO, GRC, etc.)
#   - Frontend routing by hostname:
#       fcc-staff.tunnel.ictpack.net → staff-portal (internal :3000)
#       fcc.tunnel.ictpack.net       → client-portal (internal :3000)
#
# So only ONE local port (8080) needs to be tunneled — under two subdomains.
# =============================================================================

# Client Portal + All APIs
# Access: http://fcc.tunnel.ictpack.net/
# APIs  : http://fcc.tunnel.ictpack.net/api/v1/auth/login/ etc.
[[proxies]]
name = "fims-client"
type = "http"
localIP = "127.0.0.1"
localPort = 8080
subdomain = "fcc"

# Staff Portal (same gateway port — NGINX routes by hostname match ~fims-staff)
# Access: http://fims-staff.tunnel.ictpack.net/
[[proxies]]
name = "fims-staff"
type = "http"
localIP = "127.0.0.1"
localPort = 8080
subdomain = "fims-staff"

# Kafka UI — message broker monitoring dashboard
# Access: http://fims-kafka.tunnel.ictpack.net/
[[proxies]]
name = "fims-kafka-ui"
type = "http"
localIP = "127.0.0.1"
localPort = 9093
subdomain = "fims-kafka"
