version: '3.8'

services:
  grc-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8006:8006"
    env_file:
      - .env
    depends_on:
      - postgres-grc-service
      - redis-grc-service
    networks:
      - fims-network

  grc-celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config.celery_app worker -l info --concurrency=2
    env_file:
      - .env
    depends_on:
      - postgres-grc-service
      - redis-grc-service
    networks:
      - fims-network

  grc-celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config.celery_app beat -l info
    env_file:
      - .env
    depends_on:
      - postgres-grc-service
      - redis-grc-service
    networks:
      - fims-network

  postgres-grc-service:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-fims_grc}
      POSTGRES_USER: ${DB_USER:-grc_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grc_password_2024}
    ports:
      - "5437:5432"
    volumes:
      - postgres_grc_data:/var/lib/postgresql/data
    networks:
      - fims-network

  redis-grc-service:
    image: redis:7-alpine
    ports:
      - "6384:6379"
    networks:
      - fims-network

volumes:
  postgres_grc_data:

networks:
  fims-network:
    external: true
